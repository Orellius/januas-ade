[package]
name = "januas-renderer"
version = "0.0.0"
description = "Januas ADE — GPU rendering pipeline"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.19", features = ["derive"] }
glyphon = "0.11.0"
png = "0.17.16"
pollster = "0.4.0"
tracing = "0.1.44"
wgpu = "29"
winit = "0.30.13"
# Added via `cargo add` in S1.2 — versions resolved from current crates.io.
# bytemuck added in S5.5a for rect-pipeline instance/uniform casts.
# png added in S5.5d for the image-texture pipeline (the brand logo); chosen
# over `image` because we only ingest PNG + RGBA and `png` pulls in 1/10th
# the transitive surface.

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[example]]
name = "bench_rects"
path = "examples/bench_rects.rs"
